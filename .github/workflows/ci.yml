# ===========================================
# Mavora - CI Pipeline
# Runs on every push and pull request
# ===========================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # -------------------------------------------
  # Job 1: Code Quality (Lint + Type Check)
  # -------------------------------------------
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 ESLint
        run: npm run lint --if-present
        continue-on-error: true

      - name: 📝 Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 🔍 Format Check (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}" "src/**/*.{css,scss}"
        continue-on-error: true

  # -------------------------------------------
  # Job 2: Unit Tests
  # -------------------------------------------
  tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --run --reporter=verbose

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # -------------------------------------------
  # Job 3: Build Verification
  # -------------------------------------------
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: tests
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📦 Upload build artifacts
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            public/
          retention-days: 1

  # -------------------------------------------
  # Job 4: Security Scan
  # -------------------------------------------
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔒 Check for vulnerabilities
        run: npm audit --json > audit-report.json || true

      - name: 📊 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 30

  # -------------------------------------------
  # Job 5: PWA & Performance Checks
  # -------------------------------------------
  pwa-check:
    name: 📱 PWA Validation
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: ✅ Validate manifest.json
        run: |
          echo "Checking PWA manifest..."
          if [ -f "public/manifest.json" ]; then
            cat public/manifest.json | jq . > /dev/null && echo "✅ Valid JSON" || echo "❌ Invalid JSON"
          else
            echo "⚠️ No manifest.json found"
          fi

      - name: ✅ Check service worker
        run: |
          echo "Checking service worker..."
          if [ -f "public/sw.js" ] || [ -f "public/service-worker.js" ]; then
            echo "✅ Service worker exists"
          else
            echo "⚠️ No service worker found"
          fi

      - name: ✅ Check PWA icons
        run: |
          echo "Checking PWA icons..."
          for size in 72 96 128 144 152 192 384 512; do
            if [ -f "public/icons/icon-${size}x${size}.svg" ] || [ -f "public/icons/icon-${size}x${size}.png" ]; then
              echo "✅ Icon ${size}x${size} exists"
            else
              echo "⚠️ Icon ${size}x${size} missing"
            fi
          done

  # -------------------------------------------
  # Summary
  # -------------------------------------------
  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [quality, tests, build, security, pwa-check]
    if: always()
    
    steps:
      - name: 📋 CI Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Passed' || '⚠️ Completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PWA Check | ${{ needs.pwa-check.result == 'success' && '✅ Passed' || '⚠️ Completed' }} |" >> $GITHUB_STEP_SUMMARY
