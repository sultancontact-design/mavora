# ===========================================
# Mavora Marketplace - Docker Compose
# Complete setup with app, redis, and optional services
# ===========================================

version: '3.8'

services:
  # -------------------------------------------
  # Main Application
  # -------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mavora-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mavora2024}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mavora-network
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------
  # Redis - Cache & Sessions
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mavora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-mavora2024}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - mavora-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mavora2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

# -------------------------------------------
# Volumes (Persistent Data)
# -------------------------------------------
volumes:
  redis_data:
    driver: local
  uploads:
    driver: local

# -------------------------------------------
# Networks
# -------------------------------------------
networks:
  mavora-network:
    driver: bridge

