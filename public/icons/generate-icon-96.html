<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Mavora Icon 96x96</title>
  <style>
    body { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      background: #f3f4f6; 
      font-family: system-ui, sans-serif;
    }
    .container { text-align: center; }
    img { box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 16px; }
    .info { margin-top: 20px; color: #4b5563; }
    button { 
      margin-top: 15px; 
      padding: 10px 24px; 
      background: #2563eb; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 14px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Mavora Icon Generator</h1>
    <p class="info">حجم: 96 × 96 بكسل</p>
    <img id="icon" width="96" height="96" />
    <br/>
    <button onclick="downloadIcon()">⬇️ تحميل أيقونة PNG</button>
    <p class="info" style="font-size: 12px;">انقر على الزر لتحميل الأيقونة</p>
  </div>

  <script>
    const svgString = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="20.16" fill="url(#grad1)"/>
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="white" text-anchor="middle">M</text>
  <circle cx="400" cy="120" r="60" fill="#fbbf24"/>
  <path d="M380 120 L400 140 L430 100" stroke="white" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
    const blob = new Blob([svgString], {type: 'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    
    document.getElementById('icon').src = url;
    
    function downloadIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 96;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0, 96, 96);
        canvas.toBlob(function(blob) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'icon-96x96.png';
          a.click();
        }, 'image/png');
      };
      img.src = url;
    }
  </script>
</body>
</html>
